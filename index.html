<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <section class="card">
      <picture class="container">
        <img src="./images/image-equilibrium.jpg" alt="Avatar" class="image" />
        <div class="middle">
          <div class="text">
            <img src="./images/icon-view.svg" class="icon" alt="view icon" />
          </div>
        </div>
      </picture>

      <main class="content">
        <h1 class="heading">Equilibrium #3429</h1>
        <p class="description">
          Our Equilibrium collection promotes balance and calm.
        </p>

        <div class="info">
          <span class="ETH">
            <img src="./images/icon-ethereum.svg" alt="ethereum icon" />
            <p>0.041 ETH</p>
          </span>
          <span class="time-left">
            <img src="./images/icon-clock.svg" alt="clock icon" />
            <p>3 days left</p>
          </span>
        </div>
        <hr />
        <div class="profile">
          <img src="./images/image-avatar.png" alt="avatar image" />
          <p>Creation of <span>Jules Wyvern</span></p>
        </div>
      </main>
    </section>

    <footer class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener noreferrer"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://github.com/ALPHA-STUDIO-CODE">ALPHA STUDIO CODE</a>.
    </footer>
  </body>
</html>
